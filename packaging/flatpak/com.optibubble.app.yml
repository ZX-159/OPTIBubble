# OPTIBubble — Flatpak manifest (source-run, offline build).
#
# Design notes (see packaging/README.md):
#   * The app runs from SOURCE Python, NOT a frozen PyInstaller binary. That
#     sidesteps PyInstaller's /tmp/_MEIPASS extraction, which can fail against a
#     read-only OSTree sandbox where /app is immutable. Data is written to the
#     sandbox's persistent $XDG_DATA_HOME, so no _MEIPASS writes are needed at all.
#   * Every runtime Python dependency is VENDORED as a wheel `sources` entry and
#     installed with `--no-index` in `build-commands`. flatpak-builder downloads
#     them during the source-download phase (network allowed there) and the
#     sandbox compile runs fully offline — no `pip install`/`npm install` network
#     pulls during the build. Re-run `python3 tools/flatpak_deps.py` after any
#     requirements.txt change to refresh this list.
#   * The React SPA (`optibubble/web/dist`) is built by CI *before* flatpak-builder
#     snapshots the repo (`type: dir path: ../..`), so it ships in the bundle.
app-id: com.optibubble.app
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: optibubble

finish-args:
  # The app is a local Wi-Fi server + a system-browser UI.
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Data persistence: results/sheets/archive live in the sandboxed XDG data dir.
  - --filesystem=xdg-data
  # Let the user open/export documents through the portal.
  - --filesystem=xdg-documents
  # The app-installed Python packages live in a version-agnostic dir (pip
  # --target), so PYTHONPATH is stable regardless of the runtime's Python minor.
  - --env=PYTHONPATH=/app/optibubble/lib
  # WebKitGTK can abort with "Could not create default EGL display:
  # EGL_BAD_PARAMETER" inside a sandbox (no usable GPU path). Force the
  # software / non-dmabuf compositing path so the webview renders.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  # -- runtime Python dependencies, installed offline from vendored wheels ----
  - name: python3-deps
    buildsystem: simple
    build-commands:
      # --target writes every package flat into /app/optibubble/lib (no
      # site-packages subdir), so PYTHONPATH is version-agnostic — this can't
      # break if the freedesktop 24.08 runtime ships a Python minor other than
      # the one this manifest was written for. The wheels were resolved for the
      # same glibc the 24.08 SDK ships (>= 2.34), so they install cleanly here.
      - python3 -m pip install --no-index --no-deps --target=/app/optibubble/lib wheels/*.whl

    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/10/cb/f2ad4230dc2eb1a74edf38f1a38b9b52277f75bef262d8908e60d957e13c/blinker-1.9.0-py3-none-any.whl
