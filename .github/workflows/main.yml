# ============================================================================
# OPTIBubble — main.yml
# MANUAL-ONLY release workflow. It does NOT run on push, on pull requests, or
# on any automatic event. It runs only when you trigger it by hand from the
# Actions tab → "Build & Release" → Run workflow.
#
# When you trigger it you must fill in:
#   • release_version  (required)  e.g. 2.0.3  → creates the tag + draft release v2.0.3
#   • release_notes    (optional)               → the release body (markdown)
#
# What it does, in order:
#   1. selftest        — install deps, build the React SPA, run python selftest.py
#   2. prepare-release — create the draft release + tag (single point, no races)
#   3. tauri  (matrix) — build every installer IN PARALLEL:
#                        Linux .deb · .rpm · .AppImage · macOS dmg (arm+intel) · Windows MSI+NSIS
#   4. checksums       — generate SHA256SUMS and attach it
#
# CACHING so a re-run of the same code is fast (nothing rebuilt that didn't change):
#   • npm  → frontend/node_modules
#   • pip  → the Python engine deps
#   • cargo→ src-tauri build output
#   • the frozen PyInstaller engine (keyed on source, so a version bump alone
#     doesn't re-freeze it)
#
# No git tag and no signing secrets are required — the release is a DRAFT you
# review and publish. Add your Windows/macOS signing credentials later (setup.md).
# ============================================================================
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 2.0.3) — tags the draft release"
        required: true
        type: string
        default: "2.0.2"
      release_notes:
        description: "Release notes (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  checks: read

concurrency:
  # Only one manual release at a time; starting a new one cancels the previous.
  group: ${{ github.workflow }}-manual
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------- gate -
  # The quality gate. Always run first on a manual trigger. Builds the React SPA
  # (Node first) so it's present in optibubble/web/dist before anything else
  # reads it, then runs the end-to-end self-test.
  selftest:
    name: Self-test (end-to-end)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the React SPA
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: Assert the SPA bundle exists
        run: test -f optibubble/web/dist/index.html

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Run the end-to-end self-test
        run: python selftest.py

  # ---------------------------------------------------- create the release --
  # Creates the draft release + tag v<version> once, before the builder jobs run,
  # so they don't race to create the same release. They all just upload to it.
  prepare-release:
    name: Create draft release (v${{ inputs.release_version }})
    needs: selftest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      # The single release every builder uploads to. Passing this id to
      # tauri-action makes it SKIP its own getOrCreateRelease, so the 6 matrix
      # legs can't race to create the same draft (the source of duplicate/409
      # "already exists" errors and flaky uploads). One owner, one release.
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create (or update) the draft release + tag
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          name: "OPTIBubble v${{ inputs.release_version }}"
          body: "${{ inputs.release_notes || 'Run **Build & Release** on GitHub, review the draft below, then publish.' }}"
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------- installers matrix -
  # One row per deliverable, all running IN PARALLEL. Linux is split into three
  # jobs (.deb / .rpm / .AppImage) so they build concurrently; macOS (arm+intel)
  # and Windows run alongside. Every row stamps the release version into the app
  # so the installer reports it, then uploads to the draft release v<version>.
  tauri:
    name: ${{ matrix.name }}
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux .deb
            platform: ubuntu-22.04
            args: "--bundles deb"
          - name: Linux .rpm
            platform: ubuntu-22.04
            args: "--bundles rpm"
          - name: Linux AppImage
            platform: ubuntu-22.04
            args: "--bundles appimage"
          - name: macOS dmg (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS dmg (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Windows MSI + NSIS
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cargo cache is keyed on the committed Cargo.toml/Cargo.lock, so restore
      # happens BEFORE we bump the version — heavy Rust deps stay cached across
      # version numbers (only the thin app crate recompiles).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Linux system dependencies (WebKit)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      # Stamp the release version after the cargo cache so the cache key stays
      # stable. The installer and printout report this version.
      - name: Sync the release version into the app
        run: python tools/sync_version.py "${{ inputs.release_version }}"

      # The React SPA MUST be built before freezing/verifying — web/dist is a
      # build artifact, not committed, so without this the installers ship only
      # the legacy HTML pages.
      - name: Build the React SPA
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: Assert the SPA bundle exists
        run: test -f optibubble/web/dist/index.html

      # Reuse the frozen engine across runs. Keyed on SOURCE (not version), so an
      # unchanged engine is restored from cache and the freeze is skipped.
      - name: Restore the frozen engine from cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/engine/optibubble-engine*
            build-engine
          key: engine-${{ runner.os }}-${{ hashFiles('main.py','optibubble/**','optibubble.spec','requirements.txt') }}
          # No restore-keys fallback: a fuzzy restore could hand back an engine
          # built from OLD source, silently shipping stale code.

      - name: Freeze the Python engine (if not cached)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="src-tauri/engine/optibubble-engine.exe"; else BIN="src-tauri/engine/optibubble-engine"; fi
          if [ ! -f "$BIN" ]; then
            pip install -r requirements.txt pyinstaller
            pyinstaller optibubble.spec --distpath src-tauri/engine --workpath build-engine --noconfirm
          fi

      - name: Build ${{ matrix.name }} & attach to the draft release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          # Upload to the release that prepare-release already created. Giving
          # tauri-action the id makes it skip create — no race between the
          # parallel legs, and no "release already exists" 409s.
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          # Keep building even if one leg's upload hiccups; the action retries.
          retryAttempts: 3
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------- SHA256SUMS (supply chain) --
  checksums:
    name: Generate & verify SHA256SUMS
    # tauri (all installers uploaded) + prepare-release (to reuse its release id)
    needs: [tauri, prepare-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The release is a DRAFT, so `gh release download` errors (cli/cli#10797)
      # and `browser_download_url` 404s (it only works after publish; it's a
      # browser-cookie endpoint). We pull assets through the API instead:
      #
      #   * Resolve the release ID by tag (draft releases are returned), falling
      #     back to listing releases to find it — robust against a tag-lookup 404.
      #   * List assets, skipping any pre-existing SHA256SUMS/signatures so we
      #     hash ONLY the installers.
      #   * Download each via GET /releases/assets/{asset_id} with
      #     Accept: application/octet-stream.
      #
      # We use `gh` (preinstalled on ubuntu-latest) rather than raw curl because
      # GitHub redirects that request to a signed S3 URL. `gh` follows the
      # redirect while STRIPPING the Authorization header on the cross-host hop —
      # a bare `curl -L -H "Authorization: ..."` re-sends that header to S3,
      # which rejects it (the 404 you hit). `gh` also authenticates via GH_TOKEN.
      - name: Download the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_version }}"
          mkdir -p assets && cd assets

          # 1 · resolve the release id. Prefer the id prepare-release captured
          # (one authoritative release the whole pipeline uses); fall back to a
          # tag lookup, then to listing releases, so this never 404s on a draft.
          RELEASE_ID="${{ needs.prepare-release.outputs.release_id }}"
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
                          --jq '.id' 2>/dev/null || true)
          fi
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "/repos/$GITHUB_REPOSITORY/releases" --paginate \
                          --jq ".[] | select(.tag_name==\"v$VERSION\") | .id" | head -1)
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Could not find a release for v$VERSION (id lookup failed)."
            exit 1
          fi
          echo "Found release id $RELEASE_ID"

          # 2 · list installer assets (id \t name), excluding checksums/signatures
          gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' \
            | grep -Ev $'\t(SHA256SUMS|SHA256SUMS\\.asc|SHA256SUMS\\.sig)$' > assets.tsv

          if [ ! -s assets.tsv ]; then
            echo "::error::No installer assets found on the release — the upload likely failed."
            exit 1
          fi
          echo "Found $(wc -l < assets.tsv) installer asset(s) to checksum."

          # 3 · download each asset by id (octet-stream; gh handles the S3 redirect)
          while IFS=$'\t' read -r id name; do
            echo "  ↓ $name (asset $id)"
            gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H "Accept: application/octet-stream" > "$name"
          done < assets.tsv
          rm -f assets.tsv
          echo "All assets downloaded."

      # Only hash real binaries (not the checksum/signatures themselves). Fail
      # loudly if there is nothing to hash, so a broken release is caught here.
      - name: Generate SHA256SUMS
        run: |
          cd assets
          count=$(ls -1 | grep -Eiv '^SHA256SUMS(\.asc|\.sig)?$' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No installers to checksum — aborting."
            exit 1
          fi
          sha256sum * > SHA256SUMS
          echo "sha256sum -c SHA256SUMS"
          cat SHA256SUMS

      # Self-verify the file we just produced before attaching it, so we never
      # publish a checksum that doesn't match the uploads.
      - name: Verify the checksums file
        run: cd assets && sha256sum -c SHA256SUMS

      - name: Attach the checksums file to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          draft: true
          files: assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
